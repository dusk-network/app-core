name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Validate package release ages
        run: node scripts/verify-package-release-ages.js --days 7
      - name: Pin npm
        run: npm install --global npm@11.18.0 --ignore-scripts
        working-directory: ${{ runner.temp }}
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify registry signatures
        run: npm audit signatures
      # The withdrawal tests run the network's data drivers, which git doesn't
      # keep: fetched from their pinned URL, and checked against the hashes
      # the network's file pins. A fetch that fails, or a driver that isn't
      # the pinned one, fails the job.
      - name: Fetch the data drivers
        run: npm run fetch:drivers
      - run: npm run check:versions
      - run: npm test
      - run: npm run typecheck
      # What the publish workflow sends to JSR, checked with the same CLI.
      - run: npm run check:jsr
