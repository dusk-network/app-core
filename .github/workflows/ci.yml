name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm ci
      - run: npm run check:versions
      - run: npm test
      - run: npm run typecheck
      # What the publish workflow sends to JSR, checked with the same CLI.
      - run: npm run check:jsr
