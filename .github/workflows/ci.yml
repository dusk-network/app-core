name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm ci
      # The withdrawal tests run the network's data drivers, which git doesn't
      # keep: fetched from their pinned URL, and checked against the hashes
      # the network's file pins. A fetch that fails, or a driver that isn't
      # the pinned one, fails the job.
      - name: Fetch the data drivers
        run: npm run fetch:drivers
      - run: npm run check:versions
      - run: npm test
      - run: npm run typecheck
      # What the publish workflow sends to JSR, checked with the same CLI.
      - run: npm run check:jsr
